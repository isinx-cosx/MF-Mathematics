[package]
name = "mfmath-installer"
version = "2.0.0"
edition = "2021"
description = "MF-Mathematics 安装器：释放载荷、建快捷方式、写卸载信息、卸载"

[[bin]]
name = "mfmath-installer"
path = "src/main.rs"

[build-dependencies]
# 把图标与版本信息嵌进 exe。没有它，安装器只有通用 exe 图标。
embed-resource = "3"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2.5.0"
winreg = "0.56.0"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
